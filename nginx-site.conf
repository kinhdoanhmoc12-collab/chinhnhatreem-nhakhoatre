# chinhnhatreem.com – tạo bởi install.sh

# HTTP -> HTTPS (1 bước, về tên miền chính không www)
server {
  listen 80; listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;
  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://__DOMAIN__$request_uri; }
}

# https://www -> https://tên miền chính
server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name www.__DOMAIN__;
  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  return 301 https://__DOMAIN__$request_uri;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name __DOMAIN__;
  root __ROOT__;
  index index.html;
  charset utf-8;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  error_page 404 /404.html;
  location = /404.html { internal; expires epoch; }

  # Đường dẫn gọn: /hoi-dap thay vì /hoi-dap.html (301 nếu ai gõ .html)
  location = / { try_files /_gen/index.html /index.html =404; expires epoch; }
  location ^~ /_gen/ { internal; }
  location = /index.html { return 301 /; }
  # File xác minh Google Search Console (không chuyển hướng 301)
  location ~ ^/google[a-z0-9]+\.html$ { try_files $uri =404; }
  location ~ ^/(.+)\.html$ { return 301 /$1; }
  # Bài viết; bài đã xóa/gỡ thì chuyển hướng 301 về trang Kiến thức chỉnh nha (giữ SEO)
  location ^~ /bai-viet/ {
    if (-f $document_root/_gen/da-xoa$uri) { return 301 /kien-thuc-chinh-nha; }
    try_files /_gen$uri.html =404;
    expires epoch;
  }
  location / {
    try_files /_gen$uri.html $uri $uri.html $uri/ =404;
    expires epoch;
  }

  location ^~ /images/ {
    expires 30d;
    try_files $uri =404;
  }
  location = /robots.txt  { try_files $uri =404; }
  location = /sitemap.xml { try_files /_gen/sitemap.xml /sitemap.xml =404; }
  location ^~ /uploads/ { alias __ROOT__/_gen/uploads/; expires 30d; }
  location = /llms.txt    { default_type text/plain; try_files $uri =404; }

  # Form đặt lịch / câu hỏi
  location ^~ /api/ {
    location ~ ^/api/_ { deny all; }
    location ~ ^/api/(dat-lich|cau-hoi)\.php$ {
      limit_req zone=nkt_forms burst=10 nodelay;
      client_max_body_size 32k;
      include snippets/fastcgi-php.conf;
      fastcgi_pass unix:__PHPSOCK__;
    }
    return 404;
  }

  # Trang quản trị (đăng nhập riêng cho từng bác sĩ)
  location ^~ /quan-ly/ { return 301 /quan-tri/?p=leads; }
  location ^~ /quan-tri/ {
    index index.php;
    client_max_body_size 12m;
    location = /quan-tri/index.php {
      limit_req zone=nkt_admin burst=300 nodelay;
      include snippets/fastcgi-php.conf;
      fastcgi_param PHP_VALUE "upload_max_filesize=12M \n post_max_size=14M";
      fastcgi_pass unix:__PHPSOCK__;
    }
    location ~ \.php$ { deny all; }
  }

  location ~ /\. { deny all; }
}
